name: Deploy Main and Dev to GitHub Pages

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo

      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: development
          path: dev-repo

      - name: Build combined site
        run: |
          mkdir -p site/dev
          cp -r main-repo/* site/
          cp -r dev-repo/* site/dev/
          rm -rf site/.git site/dev/.git site/.github site/dev/.github
          touch site/.nojekyll
          echo "=== Files in root (main) ==="
          ls -la site
          echo "=== Files in /dev (development) ==="
          ls -la site/dev

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
