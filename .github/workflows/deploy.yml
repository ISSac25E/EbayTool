name: Deploy All Branches to GitHub Pages

on:
  push:
    branches:
      - '**'
  delete:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build combined site for all branches
        run: |
          # Ensure all remote branch refs are fetched and up-to-date
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

          mkdir -p site
          touch site/.nojekyll

          # Collect all remote branches (excluding HEAD and gh-pages), placing main first
          BRANCHES=$(git for-each-ref --format='%(refname:lstrip=3)' refs/remotes/origin/ | grep -vE '^(HEAD|gh-pages)$')
          ORDERED_BRANCHES=""
          if echo "$BRANCHES" | grep -qx "main"; then
            ORDERED_BRANCHES="main"
          fi
          for b in $BRANCHES; do
            if [ "$b" != "main" ]; then
              ORDERED_BRANCHES="$ORDERED_BRANCHES $b"
            fi
          done

          for BRANCH in $ORDERED_BRANCHES; do
            echo "Processing branch: $BRANCH"

            # 1. Determine target directory and environment badge settings
            if [ "$BRANCH" = "main" ]; then
              TARGET_DIR="site"
              ENV_BADGE="PROD"
              ENV_CLASS="env-prod"
            elif [ "$BRANCH" = "development" ]; then
              TARGET_DIR="site/dev"
              ENV_BADGE="DEV"
              ENV_CLASS="env-dev"
            else
              TARGET_DIR="site/$BRANCH"
              ENV_BADGE="$BRANCH"
              ENV_CLASS="env-dev"
            fi

            # 2. Extract branch contents into target directory
            mkdir -p "$TARGET_DIR"
            git archive "origin/$BRANCH" | tar -x -C "$TARGET_DIR"
            rm -rf "$TARGET_DIR/.github" "$TARGET_DIR/.gitignore"

            # 3. Capture dynamic commit timestamp for this branch
            REV=$(git log -1 --format=%ad --date=format:'%Y.%m.%d-%H%M' "origin/$BRANCH")
            REV=${REV:-$(date -u +"%Y.%m.%d-%H%M")}

            # 4. Inject revision, cache-busting version, and environment badges
            if [ -f "$TARGET_DIR/index.html" ]; then
              sed -i "s|__BUILD_REV__|$REV|g" "$TARGET_DIR/index.html"
              sed -i "s|__ENV_BADGE__|$ENV_BADGE|g" "$TARGET_DIR/index.html"
              sed -i "s|__ENV_CLASS__|$ENV_CLASS|g" "$TARGET_DIR/index.html"
              sed -i "s|__BRANCH__|$BRANCH|g" "$TARGET_DIR/index.html"

              echo "=== Injected Site ($TARGET_DIR/index.html) ==="
              grep -E "env-badge|rev-text|script.js\?v=|styles.css\?v=" "$TARGET_DIR/index.html" || true
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
